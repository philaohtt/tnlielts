<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctor • Candidates</title>
    <style>
        :root {
            --primary-blue: #0055A4;
            --idp-red: #e31837;
            --bg-gray: #f8f9fa;
            --border-color: #dee2e6;
            --text-dark: #333;
            --text-muted: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Bar */
        header {
            background: #fff;
            border-bottom: 2px solid var(--primary-blue);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary-blue);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Layout Columns */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .column-left {
            width: 350px;
            border-right: 1px solid var(--border-color);
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .column-right {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: #fff;
        }

        /* Left Panel Styles */
        .list-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        #searchInput {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        #candidateList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .candidate-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f1f1;
            cursor: pointer;
            transition: background 0.2s;
        }

        .candidate-item:hover {
            background-color: #f0f7ff;
        }

        .candidate-item.active {
            background-color: #e7f1ff;
            border-left: 4px solid var(--primary-blue);
        }

        .candidate-item .name {
            font-weight: 600;
            display: block;
        }

        .candidate-item .meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Editor Styles */
        .editor-card {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="date"], select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        input[readonly] {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        .id-input-group {
            display: flex;
            gap: 5px;
        }

        /* Buttons & Pills */
        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid transparent;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        /* STATUS PILLS */
        .pill { 
            padding: 0.25rem 0.6rem; 
            border-radius: 99px; 
            font-size: 0.7rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            display: inline-block;
        }
        .pill-scheduled { background: #e0f2fe; color: #0369a1; }
        .pill-live { background: #d1fae5; color: #047857; }
        .pill-paused { background: #fef3c7; color: #b45309; }
        .pill-ended { background: #f3f4f6; color: #4b5563; }

        /* COLLAPSIBLE SCHEDULE DETAILS */
        .schedule-details-toggle {
            margin-left: 10px;
            padding: 2px 6px;
            font-size: 0.7rem;
            color: var(--primary-blue);
            background: none;
            border: 1px solid currentColor;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .schedule-details-toggle:hover {
            background: var(--primary-blue);
            color: white;
        }
        .schedule-details {
            margin-top: 8px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: none;
        }
        .schedule-details.visible {
            display: block;
        }
        .schedule-detail-item {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }
        .schedule-detail-label {
            font-weight: 500;
            color: var(--text-muted);
        }
        .schedule-detail-value {
            font-family: monospace;
            color: var(--text-dark);
        }

        .btn-primary { background: var(--primary-blue); color: white; }
        .btn-primary:hover { background: #004485; }
        
        .btn-outline { border-color: var(--primary-blue); color: var(--primary-blue); background: #fff; }
        .btn-outline:hover { background: #f0f7ff; }

        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #bd2130; }

        .btn-secondary { background: #6c757d; color: white; }

        .actions-bar {
            display: flex;
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        /* Schedule Section */
        .schedule-section h3 {
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        #scheduleAssignList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .schedule-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: #fdfdfd;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .schedule-row label {
            cursor: pointer;
            flex: 1;
            display: flex;
            justify-content: space-between;
        }

        /* Toast Message */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 4px;
            color: white;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1>Proctor • Candidates</h1>
        <div class="header-actions">
            <a href="Proctor_Sessions.html" class="btn btn-outline">Sessions</a>
            <a href="index.html" class="btn btn-outline">Back to Dashboard</a>
        </div>
    </header>

    <main>
        <!-- LEFT COLUMN: LIST -->
        <section class="column-left">
            <div class="list-header">
                <input type="text" id="searchInput" placeholder="Search name or ID...">
                <button id="newBtn" class="btn btn-primary" style="width: 100%;">+ New Candidate</button>
            </div>
            <ul id="candidateList">
                <!-- Loaded dynamically -->
            </ul>
        </section>

        <!-- RIGHT COLUMN: EDITOR -->
        <section class="column-right">
            <div class="editor-card">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name*</label>
                        <input type="text" id="fullName" placeholder="e.g. John Doe">
                    </div>
                    <div class="form-group">
                        <label for="testerId">Tester ID</label>
                        <div class="id-input-group">
                            <input type="text" id="testerId" readonly placeholder="Click Generate">
                            <button id="genIdBtn" class="btn btn-outline">Generate</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth*</label>
                        <input type="date" id="dob">
                    </div>
                    <div class="form-group">
                        <label for="className">Class*</label>
                        <input type="text" id="className" placeholder="e.g. IELTS-A2024">
                    </div>
                </div>

                <div class="actions-bar">
                    <button id="saveBtn" class="btn btn-primary">Save Candidate</button>
                    <button id="clearBtn" class="btn btn-secondary">Clear</button>
                    <button id="deleteBtn" class="btn btn-danger" style="margin-left: auto; display: none;">Delete</button>
                </div>

                <div class="schedule-section">
                    <h3>Assign Schedules</h3>
                    <div id="scheduleAssignList">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast"></div>

    <script type="module">
        import { 
            generateTesterId, 
            createCandidate, 
            updateCandidate, 
            deleteCandidate, 
            listCandidates, 
            listSchedules, 
            assignCandidateToSchedule, 
            unassignCandidateFromSchedule 
        } from '../db/db.proctor.js';

        // State
        let allCandidates = [];
        let allSchedules = [];
        let selectedCandidateId = null;

        // Elements
        const els = {
            searchInput: document.getElementById('searchInput'),
            newBtn: document.getElementById('newBtn'),
            candidateList: document.getElementById('candidateList'),
            fullName: document.getElementById('fullName'),
            dob: document.getElementById('dob'),
            className: document.getElementById('className'),
            testerId: document.getElementById('testerId'),
            genIdBtn: document.getElementById('genIdBtn'),
            saveBtn: document.getElementById('saveBtn'),
            deleteBtn: document.getElementById('deleteBtn'),
            clearBtn: document.getElementById('clearBtn'),
            scheduleAssignList: document.getElementById('scheduleAssignList'),
            toast: document.getElementById('toast')
        };

        // Initialize
        async function init() {
            await Promise.all([refreshCandidates(), refreshSchedules()]);
            els.searchInput.addEventListener('input', renderCandidateList);
            els.newBtn.addEventListener('click', clearForm);
            els.clearBtn.addEventListener('click', clearForm);
            els.genIdBtn.addEventListener('click', () => { els.testerId.value = generateTesterId(); });
            els.saveBtn.addEventListener('click', handleSave);
            els.deleteBtn.addEventListener('click', handleDelete);
        }

        // Data Management
        async function refreshCandidates() {
            allCandidates = await listCandidates();
            renderCandidateList();
        }

        async function refreshSchedules() {
            allSchedules = await listSchedules();
            renderSchedules();
        }

        // Rendering
        function renderCandidateList() {
            const query = els.searchInput.value.toLowerCase();
            els.candidateList.innerHTML = '';

            const filtered = allCandidates.filter(c => 
                c.fullName.toLowerCase().includes(query) || 
                c.testerId.toLowerCase().includes(query)
            );

            filtered.forEach(c => {
                const li = document.createElement('li');
                li.className = `candidate-item ${selectedCandidateId === c.id ? 'active' : ''}`;
                li.innerHTML = `
                    <span class="name">${c.fullName}</span>
                    <span class="meta">${c.testerId} • ${c.className}</span>
                `;
                li.onclick = () => selectCandidate(c);
                els.candidateList.appendChild(li);
            });
        }

        function renderSchedules() {
            if (!selectedCandidateId) {
                els.scheduleAssignList.innerHTML = '<p style="color: #999;">Select a candidate to manage schedules.</p>';
                return;
            }

            const currentCandidate = allCandidates.find(c => c.id === selectedCandidateId);
            const assignedIds = currentCandidate?.assignedScheduleIds || [];

            els.scheduleAssignList.innerHTML = '';
            allSchedules.forEach(sch => {
                const row = document.createElement('div');
                row.className = 'schedule-row';
                const isChecked = assignedIds.includes(sch.id);
                
                // Determine status
                let statusClass = 'pill-scheduled';
                let statusText = sch.status || 'upcoming';
                
                if (sch.status === 'live' && sch.paused) {
                    statusClass = 'pill-paused';
                    statusText = 'paused';
                } else if (sch.status === 'live') {
                    statusClass = 'pill-live';
                } else if (sch.status === 'ended') {
                    statusClass = 'pill-ended';
                } else if (sch.status === 'upcoming') {
                    statusClass = 'pill-scheduled';
                    statusText = 'scheduled';
                }

                const startDate = sch.startAt.toDate ? sch.startAt.toDate() : new Date(sch.startAt);
                const dateStr = startDate.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
                
                row.innerHTML = `
                    <input type="checkbox" id="sch-${sch.id}" ${isChecked ? 'checked' : ''}>
                    <label for="sch-${sch.id}" style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span>${sch.title}</span>
                            <span class="pill ${statusClass}">${statusText}</span>
                        </div>
                        <span style="color: #888;">${dateStr}</span>
                    </label>
                    <button class="schedule-details-toggle" type="button" data-schedule-id="${sch.id}">\u25bc</button>
                    <div class="schedule-details" id="details-${sch.id}">
                        <div class="schedule-detail-item">
                            <span class="schedule-detail-label">Schedule ID:</span>
                            <span class="schedule-detail-value">${sch.id}</span>
                        </div>
                        <div class="schedule-detail-item">
                            <span class="schedule-detail-label">Exam ID:</span>
                            <span class="schedule-detail-value">${sch.examId || 'None'}</span>
                        </div>
                        <div class="schedule-detail-item">
                            <span class="schedule-detail-label">Duration:</span>
                            <span class="schedule-detail-value">${sch.durationMs ? Math.round(sch.durationMs / 60000) + ' min' : '-'}</span>
                        </div>
                    </div>
                `;

                const cb = row.querySelector('input');
                cb.onchange = async () => {
                    try {
                        if (cb.checked) {
                            await assignCandidateToSchedule(sch.id, currentCandidate);
                            showToast("Assigned to schedule");
                        } else {
                            await unassignCandidateFromSchedule(sch.id, selectedCandidateId);
                            showToast("Removed from schedule");
                        }
                        await refreshCandidates();
                        // Reselect current candidate to refresh UI
                        const updated = allCandidates.find(c => c.id === selectedCandidateId);
                        if (updated) selectCandidate(updated);
                    } catch (e) {
                        console.error('Assignment error:', e);
                        showToast("Operation failed", true);
                        cb.checked = !cb.checked;
                    }
                };

                // Details toggle
                const toggleBtn = row.querySelector('.schedule-details-toggle');
                const detailsDiv = row.querySelector('.schedule-details');
                toggleBtn.onclick = (e) => {
                    e.preventDefault();
                    detailsDiv.classList.toggle('visible');
                    toggleBtn.textContent = detailsDiv.classList.contains('visible') ? '\u25b2' : '\u25bc';
                };

                els.scheduleAssignList.appendChild(row);
            });
        }

        // Editor Logic
        function selectCandidate(candidate) {
            selectedCandidateId = candidate.id;
            els.fullName.value = candidate.fullName;
            els.dob.value = candidate.dob;
            els.className.value = candidate.className;
            els.testerId.value = candidate.testerId;
            els.deleteBtn.style.display = 'block';
            
            renderCandidateList(); // Highlight active
            renderSchedules();
        }

        function clearForm() {
            selectedCandidateId = null;
            els.fullName.value = '';
            els.dob.value = '';
            els.className.value = '';
            els.testerId.value = '';
            els.deleteBtn.style.display = 'none';
            renderCandidateList();
            renderSchedules();
        }

        async function handleSave() {
            const data = {
                fullName: els.fullName.value.trim(),
                dob: els.dob.value,
                className: els.className.value.trim(),
                testerId: els.testerId.value.trim()
            };

            if (!data.fullName || !data.dob || !data.className || !data.testerId) {
                return showToast("Please fill all required fields", true);
            }

            try {
                if (selectedCandidateId) {
                    await updateCandidate(selectedCandidateId, data);
                    showToast("Candidate updated");
                } else {
                    const created = await createCandidate(data);
                    selectedCandidateId = created.id;
                    showToast("Candidate created");
                }
                await refreshCandidates();
                const updated = allCandidates.find(c => c.id === selectedCandidateId);
                if (updated) selectCandidate(updated);
            } catch (e) {
                console.error('Save error:', e);
                showToast(e.message || "Error saving candidate", true);
            }
        }

        async function handleDelete() {
            if (!selectedCandidateId || !confirm("Are you sure you want to delete this candidate?")) return;

            try {
                await deleteCandidate(selectedCandidateId);
                showToast("Candidate deleted");
                clearForm();
                await refreshCandidates();
            } catch (e) {
                showToast("Error deleting candidate", true);
            }
        }

        function showToast(msg, isError = false) {
            els.toast.textContent = msg;
            els.toast.className = isError ? 'toast-error show' : 'toast-success show';
            setTimeout(() => { els.toast.className = ''; }, 3000);
        }

        init();
    </script>
</body>
</html>
