<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Content - IELTS Builder</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body style="overflow: hidden;">
    <div class="app-container" style="grid-template-rows: 64px 1fr;">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:20px;">
                <a href="builder-metadata.html" style="color:var(--text-muted); text-decoration:none; font-size:14px;">← Config</a>
                <div style="width:1px; height:24px; background:var(--border-color);"></div>
                <div>
                    <span style="font-size: 12px; color: var(--text-muted); display: block;">TEST DESIGNER</span>
                    <span id="header-test-title" style="font-weight: 600;"></span>
                </div>
            </div>
            <div style="display:flex; gap:12px;">
                <button class="btn btn-outline" data-action="preview">Preview Exam</button>
                <button class="btn btn-primary" data-action="publish">Publish</button>
            </div>
        </header>
        <div class="content-grid">
            <aside class="column">
                <div class="skill-tabs">
                    <div class="skill-tab active">Reading</div>
                    <div class="skill-tab">Listening</div>
                    <div class="skill-tab">Writing</div>
                </div>
                <div class="scroll-area" id="builder-structure-tree">
                    <!-- Dynamic content injected by builderApp.js -->
                </div>
                <div style="padding: 15px; border-top: 1px solid var(--border-color);">
                    <button class="btn btn-outline" data-action="add-section" style="width:100%; font-size:12px;">+ Add Section</button>
                </div>
            </aside>
            <section class="column" style="background: #f4f7f6;">
                <div class="column-header">
                    <span>Questions (Prototype)</span>
                </div>
                <div class="scroll-area" id="assigned-questions-list">
                    <p style="padding: 15px; color: #999;">Question management UI is part of a future phase.</p>
                </div>
            </section>
            <section class="column">
                <div class="column-header">
                    <span>Preview (Prototype)</span>
                </div>
                <div class="scroll-area preview-pane" id="question-preview-area">
                     <p style="padding: 15px; color: #ccc; text-align: center;">Question preview UI is part of a future phase.</p>
                </div>
            </section>
        </div>
    </div>
    <div id="validation-issues" style="position:fixed; bottom:20px; right:20px; max-width:300px; z-index:9999;"></div>
    <script type="module" src="../ui/builderApp.js"></script>
</body>
</html>
