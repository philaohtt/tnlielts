<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Preview - IELTS Builder</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        /* Ensuring internal consistency for the preview environment */
        .q-box.answered { background: #2b3d4f; color: white; }
        .matching-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; background: #eee; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="taker-shell">
        <header class="taker-topbar">
            <div id="test-title" style="font-weight: bold;">IELTS Preview</div>
            <div class="section-nav" id="section-tabs"></div>
            <div id="timer-display" style="font-family: monospace; font-weight: bold;"></div>
        </header>
        <div class="taker-container">
            <aside class="q-navigator">
                <div style="font-weight: bold; font-size: 14px; color: #555; margin-bottom: 10px;">Question Navigator</div>
                <div class="q-grid" id="q-navigator-grid"></div>
            </aside>
            <main class="exam-main">
                <article class="stimulus-pane" id="stimulus-content"></article>
                <section class="question-pane" id="questions-content"></section>
            </main>
        </div>
        <footer class="taker-bottombar">
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" id="prev-btn">Back</button>
                <button class="btn btn-outline" id="next-btn">Next</button>
            </div>
            <div style="font-size: 12px; color: #666;">PREVIEW MODE - DATA NOT SAVED</div>
            <button class="btn btn-primary" style="background: #555;" onclick="window.close()">Close Preview</button>
        </footer>
    </div>

    <script type="module">
        let currentTest = null;
        let activeSectionIndex = 0;

        // --- Communication Bridge ---
        window.addEventListener('message', (event) => {
            if (event.data.type === 'IELTS_PREVIEW_LOAD') {
                currentTest = event.data.payload;
                renderTest();
                // Acknowledge receipt
                window.opener.postMessage({ type: 'PREVIEW_ACK' }, '*');
            }
        });

        // Signal to builder that we are ready to receive data
        window.opener?.postMessage({ type: 'PREVIEW_READY' }, '*');

        // --- Rendering Logic ---

        function renderTest() {
            if (!currentTest) return;
            
            document.getElementById('test-title').textContent = currentTest.title || 'Untitled Test';
            document.getElementById('timer-display').textContent = `Time: ${currentTest.durationMinutes || 60}:00`;
            
            renderSectionTabs();
            renderSection(0);
            renderGlobalNavigator();
        }

        function renderSectionTabs() {
            const container = document.getElementById('section-tabs');
            container.innerHTML = (currentTest.sections || []).map((section, idx) =>
                `<div class="section-tab ${idx === activeSectionIndex ? 'active' : ''}" data-index="${idx}">
                    ${section.title || `Section ${idx + 1}`}
                </div>`
            ).join('');

            container.querySelectorAll('.section-tab').forEach(tab => {
                tab.onclick = () => renderSection(parseInt(tab.dataset.index));
            });
        }

        function renderSection(index) {
            if (!currentTest.sections || !currentTest.sections[index]) return;
            activeSectionIndex = index;
            const section = currentTest.sections[index];

            // Update tab UI
            document.querySelectorAll('.section-tab').forEach((t, i) => t.classList.toggle('active', i === index));

            // Render Stimulus (Reading passage / Listening prompt)
            const stimulusPane = document.getElementById('stimulus-content');
            stimulusPane.innerHTML = (section.parts || []).map(p => `
                <div class="part-container" style="margin-bottom: 40px;">
                    <h3 style="margin-bottom: 15px; color: #2b3d4f;">${p.title}</h3>
                    <div class="stimulus-body" style="font-size: 16px; line-height: 1.8;">
                        ${p.stimulus?.content || '<i style="color: #999;">No stimulus content provided.</i>'}
                    </div>
                </div>
            `).join('<hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">');

            // Render Questions
            const questionsPane = document.getElementById('questions-content');
            questionsPane.innerHTML = '';
            
            (section.parts || []).forEach(part => {
                (part.questions || []).forEach(q => {
                    // CRITICAL: We use q.displayNumber calculated by our logic/normalization
                    // instead of a local loop counter to ensure WYSIWYG parity.
                    questionsPane.innerHTML += renderQuestionUI(q, q.displayNumber);
                });
            });

            // Scroll panes to top
            stimulusPane.scrollTop = 0;
            questionsPane.scrollTop = 0;
        }

        /**
         * Global Navigator: Shows all questions across the entire test
         * as per real IELTS Computer interface.
         */
        function renderGlobalNavigator() {
            const grid = document.getElementById('q-navigator-grid');
            let allQuestions = [];
            
            (currentTest.sections || []).forEach(s => {
                s.parts.forEach(p => {
                    allQuestions = allQuestions.concat(p.questions || []);
                });
            });

            grid.innerHTML = allQuestions.map(q => `
                <div class="q-box" title="Jump to Question ${q.displayNumber}">
                    ${q.displayNumber}
                </div>
            `).join('');
        }

        function renderQuestionUI(q, number) {
            const q_id = `q_${q.id}`;
            let inputHtml = '';

            // Handle fallbacks for incomplete draft data
            const promptText = q.prompt || `[Question ${number} pending content]`;
            const options = q.options || [];

            switch (q.type) {
                case 'mcq_single':
                case 'true_false_not_given':
                case 'yes_no_not_given':
                    inputHtml = options.map(opt => `
                        <div style="margin-bottom: 8px;">
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                                <input type="radio" name="${q_id}" style="width: 18px; height: 18px;"> 
                                <span>${opt.text}</span>
                            </label>
                        </div>
                    `).join('');
                    break;

                case 'mcq_multi':
                    inputHtml = options.map(opt => `
                        <div style="margin-bottom: 8px;">
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                                <input type="checkbox" style="width: 18px; height: 18px;"> 
                                <span>${opt.text}</span>
                            </label>
                        </div>
                    `).join('');
                    break;

                case 'short_answer':
                case 'sentence_completion':
                    inputHtml = `<input type="text" class="form-control" style="max-width: 400px; padding: 12px;" placeholder="Type your answer here...">`;
                    break;

                case 'matching':
                    inputHtml = `
                        <div class="matching-container" style="background: #fdfdfd; border: 1px solid #eee; padding: 15px; border-radius: 4px;">
                            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Select the correct match for each item:</p>
                            ${(q.matchingContent?.left || ['Item A', 'Item B']).map((item, idx) => `
                                <div class="matching-row">
                                    <div style="font-weight: 500;">${typeof item === 'string' ? item : item.text}</div>
                                    <select class="form-control">
                                        <option value="">Select...</option>
                                        ${(q.matchingContent?.right || []).map(r => `<option>${r.text}</option>`).join('')}
                                    </select>
                                </div>
                            `).join('')}
                        </div>`;
                    break;

                case 'dropdown_fill':
                    inputHtml = `
                        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                            <span>The candidate selects from</span>
                            <select class="form-control" style="width: auto; min-width: 150px;">
                                <option>Select option...</option>
                                ${(q.options || []).map(opt => `<option>${opt.text}</option>`).join('')}
                            </select>
                            <span>to complete the gap.</span>
                        </div>`;
                    break;

                case 'essay':
                case 'speaking_response':
                    inputHtml = `<textarea class="form-control" style="height: 300px; padding: 15px; line-height: 1.6;" placeholder="Type your response here..."></textarea>
                                 <div style="text-align: right; font-size: 12px; color: #999; margin-top: 5px;">Word count: 0</div>`;
                    break;

                default:
                    inputHtml = `<div style="padding: 20px; border: 1px dashed #ccc; color: #999; text-align: center;">
                                    Type: <strong>${q.type}</strong> (Interactive Preview pending)
                                 </div>`;
            }

            return `
                <div class="question-block" id="scroll-target-${number}" style="margin-bottom: 40px; border-left: 4px solid #eee; padding-left: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 12px; font-size: 15px;">
                        ${number}. ${promptText}
                    </label>
                    <div class="question-interaction">
                        ${inputHtml}
                    </div>
                </div>
            `;
        }

        // --- Navigation Helpers ---
        document.getElementById('next-btn').onclick = () => {
            if (activeSectionIndex < (currentTest.sections?.length - 1)) {
                renderSection(activeSectionIndex + 1);
            }
        };

        document.getElementById('prev-btn').onclick = () => {
            if (activeSectionIndex > 0) {
                renderSection(activeSectionIndex - 1);
            }
        };

    </script>
</body>
</html>
