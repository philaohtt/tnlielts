<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examiner - Attempt View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .app-shell {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 20px;
            padding: 20px;
            min-height: 100vh;
        }

        @media (max-width: 1024px) {
            .app-shell {
                grid-template-columns: 1fr;
            }
            .grading-panel {
                order: 2;
            }
            .main-content {
                order: 1;
            }
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .header-buttons button {
            padding: 8px 16px;
            border: 1px solid #d0d0d0;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .header-buttons button:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .header-buttons button.primary {
            background: #0078d4;
            color: #fff;
            border-color: #0078d4;
        }

        .header-buttons button.primary:hover {
            background: #005a9e;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .attempt-main {
            background: #fff;
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .candidate-like {
            max-width: 980px;
            margin: 0 auto;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .blocks-container {
            display: flex;
            flex-direction: column;
            gap: 0;
            max-width: 100%;
        }

        .block-wrapper {
            border-bottom: 1px solid #e8e8e8;
            padding: 20px 0;
            position: relative;
            max-width: 100%;
        }

        .block-wrapper:last-child {
            border-bottom: none;
        }

        .block-wrapper:first-child {
            padding-top: 0;
        }

        /* Auto-grading indicators */
        .block-grading-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .block-grading-badge.auto {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .block-grading-badge.manual {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            border: 1px solid #fbbf24;
        }

        .block-grading-badge svg {
            width: 16px;
            height: 16px;
        }

        /* Auto-score result display */
        .block-auto-score {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 8px 14px;
            background: #f0f9ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .block-auto-score .score-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .block-auto-score .score-label {
            color: #64748b;
            font-weight: 500;
        }

        .block-auto-score .score-value {
            color: #0369a1;
            font-weight: 700;
        }

        /* Disabled state for auto-scored blocks */
        .block-wrapper.auto-scored input:not([type="hidden"]),
        .block-wrapper.auto-scored select,
        .block-wrapper.auto-scored textarea {
            background-color: #f9fafb;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Candidate-like passage typography */
        .passage-area,
        .gap-passage {
            line-height: 2.2;
            font-size: 16px;
            color: #333;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        /* Gap fill compatibility */
        .gap-block {
            display: block;
            margin: 16px 0;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .gap-input-wrap,
        .gap-input-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            vertical-align: middle;
            line-height: 1;
        }

        .gap-input,
        .cbt-gap-input {
            border-radius: 4px;
            padding: 4px 8px;
            width: 120px;
            max-width: 100%;
            border: 1px solid #ccc;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            vertical-align: middle;
            line-height: 1.2;
        }

        .gap-input {
            text-align: left;
        }

        /* Disabled inputs - read-only examiner view */
        .gap-input:disabled,
        .cbt-gap-input:disabled {
            opacity: 1;
            background: #f1f5ff;
            color: #111;
            border-color: #d0d0d0;
            cursor: not-allowed;
        }

        /* MCQ and TFNG compatibility */
        .mcq-options,
        .tfng-statements {
            margin: 12px 0;
        }

        .option,
        .tfng-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="radio"],
        .option input[type="checkbox"],
        .tfng-item input[type="radio"] {
            cursor: pointer;
            accent-color: #0078d4;
        }

        .option input:disabled,
        .tfng-item input:disabled {
            cursor: not-allowed;
            opacity: 1;
        }

        .option label,
        .tfng-item label {
            cursor: pointer;
            flex: 1;
        }

        .option input:disabled ~ label,
        .tfng-item input:disabled ~ label {
            color: #666;
        }

        /* Grading panel */
        .grading-panel {
            background: #fff;
            border-radius: 10px;
            border: 1px solid #eee;
            padding: 16px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .grading-panel h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e8e8e8;
        }

        .grading-section {
            margin-bottom: 16px;
        }

        .grading-section label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            margin-bottom: 6px;
        }

        .grading-section select,
        .grading-section input {
            width: 100%;
            padding: 8px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .grading-section select:focus,
        .grading-section input:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.1);
        }

        .auto-score-result {
            background: #f0f4f9;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin: 12px 0;
            display: none;
        }

        .auto-score-result.show {
            display: block;
        }

        .auto-score-result strong {
            color: #0078d4;
        }

        .grading-button {
            width: 100%;
            padding: 10px;
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .grading-button:hover {
            background: #005a9e;
        }

        .grading-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 16px;
            border-radius: 6px;
            color: #856404;
            margin: 20px 0;
        }

        .candidate-info {
            grid-column: 1 / -1;
            background: #fff;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            margin-bottom: 10px;
        }

        .candidate-info h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .candidate-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .candidate-detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .candidate-detail-label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .candidate-detail-value {
            font-size: 14px;
            color: #333;
            font-weight: 400;
        }

        /* Gap Fill Visual Styles */
        .gap-visual-block {
            margin: 20px 0;
        }

        .map-stage {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        .map-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        .map-img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .text-layer,
        .gap-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .gap-layer {
            pointer-events: auto;
        }

        .map-gap-box {
            position: absolute;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #0078d4;
            border-radius: 4px;
        }

        .map-gap-box .gap-number {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: #666;
            pointer-events: none;
        }

        .map-gap-box .map-input {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: left;
            outline: none;
            padding: 2px 22px 2px 22px;
        }

        .map-gap-box .answer-icon {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
        }

        .map-text-label {
            position: absolute;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        /* Matching Visual Styles */
        .matching-canvas-task {
            margin: 20px 0;
        }

        .mc-layout {
            display: flex;
            gap: 20px;
            margin-top: 16px;
        }

        .mc-canvas-side {
            flex: 1;
        }

        .mc-bank-side {
            width: 280px;
            flex-shrink: 0;
        }

        .mc-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
        }

        .mc-img-container {
            position: relative;
            margin: 0 auto;
        }

        .mc-img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .mc-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .mc-zone {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .mc-zone--gap {
            border: 2px solid #0078d4;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.7);
        }

        .mc-zone--static {
            pointer-events: none;
        }

        .mc-zone-num {
            font-weight: 600;
            color: #666;
            font-size: 18px;
        }

        .mc-placed-pill {
            background: #e0f2fe;
            border: 1px solid #0ea5e9;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 90%;
        }

        .mc-clr {
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            padding: 0;
        }

        .mc-bank-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .mc-bank {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mc-pill {
            background: #f0f9ff;
            border: 1px solid #0ea5e9;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            user-select: none;
            transition: all 0.2s;
        }

        .mc-pill.used {
            opacity: 0.4;
            border-color: #cbd5e1;
        }

        @media (max-width: 768px) {
            .mc-layout {
                flex-direction: column;
            }

            .mc-bank-side {
                width: 100%;
            }
        }

        /* TFNG Block Styles */
        .tfng-block {
            margin: 20px 0;
        }

        .tfng-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .tfng-row {
            display: flex;
            gap: 16px;
            padding: 12px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            align-items: center;
        }

        .tfng-statement {
            flex: 1;
            color: #333;
            line-height: 1.6;
        }

        .tfng-q-num {
            font-weight: 600;
            color: #64748b;
            margin-right: 8px;
        }

        .tfng-options-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .tfng-option-label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .tfng-option-label:has(input:checked) {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .tfng-option-input {
            margin: 0;
        }

        .tfng-option-text {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
        }

        @media (max-width: 768px) {
            .tfng-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .tfng-options-group {
                width: 100%;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Examiner - Attempt View</h1>
        <div class="header-buttons">
            <button onclick="goBack()">← Back to Inbox</button>
            <button class="primary" onclick="markInReview()">Mark as In Review</button>
            <button onclick="window.print()">🖨️ Print</button>
        </div>
    </div>

    <div class="app-shell">
        <div class="candidate-info" id="candidateInfo" style="display:none;">
            <h2>Candidate Information</h2>
            <div class="candidate-details">
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Candidate Name</span>
                    <span class="candidate-detail-value" id="candidateName">-</span>
                </div>
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Candidate ID</span>
                    <span class="candidate-detail-value" id="candidateId">-</span>
                </div>
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Exam ID</span>
                    <span class="candidate-detail-value" id="examId">-</span>
                </div>
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Status</span>
                    <span class="candidate-detail-value" id="attemptStatus">-</span>
                </div>
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Submitted At</span>
                    <span class="candidate-detail-value" id="submittedAt">-</span>
                </div>
            </div>
        </div>

        <div class="candidate-info" id="testInfo" style="display:none;">
            <h2>Test Information</h2>
            <div class="candidate-details">
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Test Name</span>
                    <span class="candidate-detail-value" id="testName">-</span>
                </div>
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Test ID</span>
                    <span class="candidate-detail-value" id="testId">-</span>
                </div>
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Skill</span>
                    <span class="candidate-detail-value" id="testSkill">-</span>
                </div>
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Duration</span>
                    <span class="candidate-detail-value" id="testDuration">-</span>
                </div>
                <div class="candidate-detail-item">
                    <span class="candidate-detail-label">Sections</span>
                    <span class="candidate-detail-value" id="testSections">-</span>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div id="loading" class="loading">Loading attempt...</div>
            <div id="error" class="error" style="display:none;"></div>
            <div id="content" style="display:none;">
                <div class="attempt-main">
                    <div class="candidate-like">
                        <div id="blocks" class="blocks-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grading-panel">
            <h3>Auto-Scoring</h3>
            <div class="grading-section">
                <label>Skill</label>
                <select id="skillSelect">
                    <option value="">Select a skill...</option>
                    <option value="listening">Listening</option>
                    <option value="reading">Reading</option>
                </select>
            </div>
            <button class="grading-button" onclick="runAutoScore()">Run Auto-Score</button>
            <div id="autoScoreResult" class="auto-score-result"></div>
        </div>
    </div>

    <script type="module">
        import { getAttemptById, listAttempts, updateAttempt, saveAutoScore } from '../../db/db.attempts.js';
        import { DB as TESTS_DB } from '../../db/db.tests.js';
        import { renderBlock, createReadOnlyContext } from '../../candidate/blocks/index.js';
        import { computeAutoScore } from '../../examiner/logic/examiner.grade.js';

        let currentAttempt = null;
        let attemptId = null;
        let selectedSkill = null;
        let currentTest = null;

        // Helper function to escape HTML special characters
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function normTFNG(v) {
            const s = String(v || '').trim().toLowerCase();
            if (['true', 't', 'yes'].includes(s)) return 'TRUE';
            if (['false', 'f', 'no'].includes(s)) return 'FALSE';
            if (['not given', 'ng', 'n'].includes(s)) return 'NOT GIVEN';
            return '—';
        }

        function parseMcqCorrect(raw) {
            if (raw === null || raw === undefined) return [];
            if (Array.isArray(raw)) {
                return raw
                    .map(val => typeof val === 'string' ? val.trim() : val)
                    .map(val => {
                        if (typeof val === 'number') return val;
                        if (typeof val === 'string' && /^[A-Za-z]$/.test(val)) {
                            return val.toUpperCase().charCodeAt(0) - 65;
                        }
                        const num = Number(val);
                        return Number.isNaN(num) ? -1 : num;
                    })
                    .filter(idx => idx >= 0);
            }
            if (typeof raw === 'number') return [raw];
            if (typeof raw === 'string') {
                const parts = raw.split(/[,;/\s]+/).filter(Boolean);
                return parts
                    .map(part => part.trim())
                    .map(part => {
                        if (/^[A-Za-z]$/.test(part)) {
                            return part.toUpperCase().charCodeAt(0) - 65;
                        }
                        const num = Number(part);
                        return Number.isNaN(num) ? -1 : num;
                    })
                    .filter(idx => idx >= 0);
            }
            return [];
        }

        function buildGapAnswerMap(data) {
            const answerKey = data.answerKey || data.correctAnswers || data.answers || {};
            const map = { ...answerKey };

            if (Array.isArray(data.gaps)) {
                data.gaps.forEach(g => {
                    if (!g || !g.id) return;
                    if (Array.isArray(g.answers) && g.answers.length > 0) {
                        map[g.id] = g.answers;
                    }
                });
            }

            return map;
        }

        // Enhance GAP_FILL and GAP_FILL_VISUAL blocks
        function enhanceGapFillWithCorrectAnswers(blockHtml, block, answers) {
            const data = block.data || {};
            const blockType = block.type ? block.type.toLowerCase() : '';
            const answerMap = buildGapAnswerMap(data);
            const gapfillAnswers = answers?.gap || {};

            // For gap_fill_visual, color inputs and show correct answers below the map
            if (blockType === 'gap_fill_visual') {
                const temp = document.createElement('div');
                temp.innerHTML = blockHtml;

                const gaps = Array.isArray(data.gaps) ? data.gaps : [];
                const orderedGaps = gaps.slice().sort((a, b) => {
                    const ay = Number.isFinite(Number(a?.y)) ? Number(a.y) : Number.POSITIVE_INFINITY;
                    const by = Number.isFinite(Number(b?.y)) ? Number(b.y) : Number.POSITIVE_INFINITY;
                    if (ay !== by) return ay - by;
                    const ax = Number.isFinite(Number(a?.x)) ? Number(a.x) : Number.POSITIVE_INFINITY;
                    const bx = Number.isFinite(Number(b?.x)) ? Number(b.x) : Number.POSITIVE_INFINITY;
                    return ax - bx;
                });

                // Color candidate answers and force numbering visible
                temp.querySelectorAll('.map-input').forEach((input) => {
                    const gapId = input.getAttribute('data-gap-id');
                    if (!gapId) return;

                    const rawCorrect = answerMap[gapId];
                    const candidateAnswer = String(gapfillAnswers[gapId] || '');

                    let correctAnswers = [];
                    if (Array.isArray(rawCorrect) && rawCorrect.length > 0) {
                        correctAnswers = rawCorrect;
                    } else if (typeof rawCorrect === 'string' && rawCorrect.trim()) {
                        correctAnswers = [rawCorrect];
                    }

                    const normalized = candidateAnswer.trim().toLowerCase();
                    const isCorrect = correctAnswers.some(ans => ans.toLowerCase().trim() === normalized);

                    const box = input.closest('.map-gap-box');
                    const numberEl = box?.querySelector('.gap-number');
                    if (numberEl) {
                        numberEl.style.display = 'inline-block';
                        numberEl.style.opacity = '1';
                    }

                    if (candidateAnswer.trim()) {
                        if (isCorrect) {
                            input.style.background = '#dcfce7';
                            input.style.borderColor = '#16a34a';
                            input.style.color = '#16a34a';
                            if (numberEl) numberEl.style.color = '#16a34a';
                        } else {
                            input.style.background = '#fee2e2';
                            input.style.borderColor = '#dc2626';
                            input.style.color = '#dc2626';
                            if (numberEl) numberEl.style.color = '#dc2626';
                        }

                        if (box && !box.querySelector('.answer-icon')) {
                            const icon = document.createElement('span');
                            icon.className = 'answer-icon';
                            icon.textContent = isCorrect ? 'V' : 'X';
                            icon.style.position = 'absolute';
                            icon.style.right = '6px';
                            icon.style.top = '50%';
                            icon.style.transform = 'translateY(-50%)';
                            icon.style.fontWeight = '700';
                            icon.style.color = isCorrect ? '#16a34a' : '#dc2626';
                            box.appendChild(icon);
                        }
                    }
                });

                // Group gaps by visual row (y position) to place correct answers below
                const rowTolerance = 0.02;
                const rows = [];
                orderedGaps.forEach((gap) => {
                    const gapY = Number.isFinite(Number(gap?.y)) ? Number(gap.y) : 0;
                    let row = rows.find(r => Math.abs(r.y - gapY) <= rowTolerance);
                    if (!row) {
                        row = { y: gapY, items: [] };
                        rows.push(row);
                    }
                    row.items.push(gap);
                });

                const answersArea = document.createElement('div');
                answersArea.style.marginTop = '12px';
                answersArea.style.display = 'flex';
                answersArea.style.flexDirection = 'column';
                answersArea.style.gap = '6px';

                rows.forEach((row, rowIdx) => {
                    const rowDiv = document.createElement('div');
                    rowDiv.style.display = 'flex';
                    rowDiv.style.flexWrap = 'wrap';
                    rowDiv.style.gap = '12px';
                    rowDiv.style.alignItems = 'center';

                    row.items.forEach((gap, idx) => {
                        const gapNumber = Number.isFinite(Number(gap?.n)) ? Number(gap.n) : (rowIdx + 1 + idx);
                        const rawCorrect = answerMap[gap.id];
                        let correctText = '—';
                        if (Array.isArray(rawCorrect) && rawCorrect.length > 0) {
                            correctText = rawCorrect.join(' / ');
                        } else if (typeof rawCorrect === 'string' && rawCorrect.trim()) {
                            correctText = rawCorrect;
                        }

                        const item = document.createElement('div');
                        item.style.display = 'flex';
                        item.style.alignItems = 'center';
                        item.style.gap = '6px';
                        item.style.padding = '4px 8px';
                        item.style.border = '1px solid #e2e8f0';
                        item.style.borderRadius = '6px';
                        item.style.background = '#f8fafc';

                        const num = document.createElement('span');
                        num.textContent = String(gapNumber);
                        num.style.fontWeight = '600';
                        num.style.color = '#0f172a';

                        const ans = document.createElement('span');
                        ans.textContent = correctText;
                        ans.style.color = '#1d4ed8';

                        item.appendChild(num);
                        item.appendChild(ans);
                        rowDiv.appendChild(item);
                    });

                    answersArea.appendChild(rowDiv);
                });

                const visualBlock = temp.querySelector('.gap-visual-block');
                if (visualBlock) {
                    const wrapper = document.createElement('div');
                    wrapper.style.display = 'flex';
                    wrapper.style.gap = '16px';
                    wrapper.style.alignItems = 'flex-start';

                    visualBlock.parentNode.insertBefore(wrapper, visualBlock);
                    wrapper.appendChild(visualBlock);

                    answersArea.style.marginTop = '0';
                    answersArea.style.minWidth = '220px';
                    wrapper.appendChild(answersArea);
                } else {
                    temp.appendChild(answersArea);
                }

                return temp.innerHTML;
            }

            // For regular gap_fill, color inputs green/red
            const gapfillAnswers_flat = gapfillAnswers;
            console.log('[GAP_FILL] enhancement start', {
                blockId: block.id,
                gapfillAnswers: gapfillAnswers_flat
            });

            const temp = document.createElement('div');
            temp.innerHTML = blockHtml;

            const inputs = temp.querySelectorAll('.gap-input, .cbt-gap-input');
            console.log(`[GAP_FILL] found ${inputs.length} input fields`);

            inputs.forEach((input, idx) => {
                const gapId = input.getAttribute('data-gap-id');
                if (!gapId) {
                    console.log(`[GAP_FILL] input ${idx} has no data-gap-id`);
                    return;
                }

                const rawCorrect = answerMap[gapId];
                const candidateAnswer = String(gapfillAnswers_flat[gapId] || '');

                // Normalize correct answers to array
                let correctAnswers = [];
                if (Array.isArray(rawCorrect) && rawCorrect.length > 0) {
                    correctAnswers = rawCorrect;
                } else if (typeof rawCorrect === 'string' && rawCorrect.trim()) {
                    correctAnswers = [rawCorrect];
                }

                const normalized = candidateAnswer.trim().toLowerCase();
                const isCorrect = correctAnswers.some(ans => ans.toLowerCase().trim() === normalized);

                console.log(`[GAP_FILL] gap ${gapId}`, {
                    candidateAnswer,
                    correctAnswers,
                    isCorrect
                });

                // Create an inline-flex container to keep inline alignment
                const container = document.createElement('span');
                container.style.display = 'inline-flex';
                container.style.alignItems = 'center';
                container.style.justifyContent = 'space-between';
                container.style.verticalAlign = 'middle';
                container.style.lineHeight = '1';
                container.style.gap = '0';
                container.style.borderRadius = '6px';
                container.style.overflow = 'hidden';

                input.parentNode.insertBefore(container, input);
                container.appendChild(input);
                input.style.flex = '1';
                input.style.borderRadius = '6px 0 0 6px';
                input.style.margin = '0';
                input.style.verticalAlign = 'middle';
                input.style.lineHeight = '1.2';

                if (isCorrect && candidateAnswer.trim()) {
                    // Green: correct answer
                    container.style.background = '#dcfce7';
                    input.style.background = '#dcfce7';
                    input.style.color = '#16a34a';
                    input.style.borderColor = '#16a34a';

                    if (!container.querySelector('.answer-icon')) {
                        const checkIcon = document.createElement('span');
                        checkIcon.className = 'answer-icon';
                        checkIcon.style.padding = '0 8px 0 6px';
                        checkIcon.style.color = '#16a34a';
                        checkIcon.style.fontSize = '16px';
                        checkIcon.style.fontWeight = 'bold';
                        checkIcon.textContent = 'V';
                        container.insertBefore(checkIcon, input);
                    }

                    // Show alternatives if more than one
                    if (correctAnswers.length > 1) {
                        const alternatives = correctAnswers.slice(1).join('/');
                        const altSpan = document.createElement('span');
                        altSpan.style.padding = '6px 12px';
                        altSpan.style.color = '#1d4ed8';
                        altSpan.style.fontSize = '13px';
                        altSpan.style.fontWeight = '500';
                        altSpan.style.whiteSpace = 'nowrap';
                        altSpan.style.background = '#dcfce7';
                        altSpan.textContent = `/${alternatives}`;
                        container.appendChild(altSpan);
                    }
                } else if (candidateAnswer.trim()) {
                    // Red with strikethrough: wrong answer + show correct
                    container.style.background = '#fee2e2';
                    input.style.background = '#fee2e2';
                    input.style.color = '#dc2626';
                    input.style.borderColor = '#dc2626';
                    input.style.textDecoration = 'line-through';

                    // Add X icon before input
                    if (!container.querySelector('.answer-icon')) {
                        const xIcon = document.createElement('span');
                        xIcon.className = 'answer-icon';
                        xIcon.style.padding = '0 8px 0 6px';
                        xIcon.style.color = '#dc2626';
                        xIcon.style.fontSize = '16px';
                        xIcon.style.fontWeight = 'bold';
                        xIcon.textContent = 'X';
                        container.insertBefore(xIcon, input);
                    }

                    // Show correct answer in blue
                    if (correctAnswers.length > 0) {
                        const correctSpan = document.createElement('span');
                        correctSpan.style.padding = '6px 12px';
                        correctSpan.style.color = '#1d4ed8';
                        correctSpan.style.fontSize = '13px';
                        correctSpan.style.fontWeight = '500';
                        correctSpan.style.whiteSpace = 'nowrap';
                        correctSpan.style.background = '#fee2e2';
                        correctSpan.textContent = correctAnswers.join('/');
                        container.appendChild(correctSpan);
                    }
                } else {
                    // No answer provided
                    input.style.opacity = '0.5';
                }
            });

            return temp.innerHTML;
        }

        // Enhance Matching Visual block: similar to gap_fill_visual
        function enhanceMatchingVisualWithCorrectAnswers(blockHtml, block, answers) {
            const data = block.data || {};
            const zones = Array.isArray(data.zones) ? data.zones : [];
            const options = Array.isArray(data.options) ? data.options : [];
            const blockId = block.id;

            // Get candidate answers
            let candMap = answers?.matching?.[blockId] || {};
            if (typeof candMap === 'string') {
                try { candMap = JSON.parse(candMap); } catch { candMap = {}; }
            }

            const temp = document.createElement('div');
            temp.innerHTML = blockHtml;

            const gapZones = zones.filter(z => z.kind !== 'text' && z.n);
            
            // Sort zones by number
            const orderedZones = gapZones.slice().sort((a, b) => {
                const an = Number(a.n) || 0;
                const bn = Number(b.n) || 0;
                return an - bn;
            });

            // Helper to normalize candidate answers (accepts optionId OR letter A/B/C)
            function getCandLetterAndText(rawVal) {
                if (rawVal == null) return { candLetter:'', candText:'', candOption:null };

                // If stored as a letter like "A"
                if (typeof rawVal === 'string' && /^[A-Za-z]$/.test(rawVal.trim())) {
                    const letter = rawVal.trim().toUpperCase();
                    const idx = letter.charCodeAt(0) - 65;
                    const opt = options[idx] || null;
                    return { candLetter: letter, candText: opt?.text || '', candOption: opt };
                }

                // If stored as an optionId
                const optId = String(rawVal);
                const opt = options.find(o => o.id === optId) || null;
                const idx = opt ? options.indexOf(opt) : -1;
                const letter = (idx >= 0) ? String.fromCharCode(65 + idx) : '';
                return { candLetter: letter, candText: opt?.text || '', candOption: opt };
            }

            // Color the zones, add numbering and icons
            orderedZones.forEach((zone) => {
                const zoneNum = zone.n;
                const zoneId = zone.id;
                const correctOptionId = zone.correctOptionId;

                // Find candidate answer
                const rawCand = candMap[zoneNum] ?? candMap[zoneId] ?? candMap[String(zoneNum)] ?? candMap[String(zoneId)];
                const { candLetter, candText } = getCandLetterAndText(rawCand);

                // Find correct answer
                const correctOption = options.find(o => o.id === correctOptionId);
                const correctLetter = correctOption ? String.fromCharCode(65 + options.indexOf(correctOption)) : '';

                const isCorrect = !!candLetter && !!correctLetter && candLetter === correctLetter;

                // Find the zone element in DOM
                const zoneEl =
                    temp.querySelector(`.mc-zone--gap[data-zone-id="${zoneId}"]`) ||
                    temp.querySelector(`.mc-zone--gap[data-zone-num="${zoneNum}"]`);
                if (!zoneEl) return;

                if (!candLetter) {
                    // No answer placed, leave zone untouched
                    return;
                }

                // Color the zone
                zoneEl.style.border = isCorrect ? '2px solid #16a34a' : '2px solid #dc2626';
                zoneEl.style.background = isCorrect ? 'rgba(220, 252, 231, 0.9)' : 'rgba(254, 226, 226, 0.9)';

                // Ensure zone provides usable width for horizontal text
                zoneEl.style.display = 'flex';
                zoneEl.style.alignItems = 'stretch';
                zoneEl.style.justifyContent = 'stretch';
                zoneEl.style.padding = '0';
                zoneEl.style.overflow = 'visible';        // let pill breathe

                // Restructure the content: number + text + icon
                const placedPill = zoneEl.querySelector('.mc-placed-pill');
                if (placedPill) {
                    // Clear existing content
                    placedPill.innerHTML = '';
                    
                    placedPill.style.width = '100%';
                    placedPill.style.maxWidth = 'none';          // IMPORTANT: override CSS max-width:90%
                    placedPill.style.height = '100%';
                    placedPill.style.minHeight = 'unset';
                    placedPill.style.display = 'flex';
                    placedPill.style.flexDirection = 'row';
                    placedPill.style.alignItems = 'center';
                    placedPill.style.justifyContent = 'space-between';
                    placedPill.style.gap = '8px';
                    placedPill.style.padding = '6px 8px';
                    placedPill.style.boxSizing = 'border-box';
                    placedPill.style.overflow = 'hidden';

                    // Add zone number
                    const numSpan = document.createElement('span');
                    numSpan.className = 'zone-number-display';
                    numSpan.textContent = String(zoneNum);
                    numSpan.style.fontWeight = '700';
                    numSpan.style.fontSize = '14px';
                    numSpan.style.minWidth = '24px';
                    numSpan.style.flexShrink = '0';
                    numSpan.style.color = isCorrect ? '#16a34a' : '#dc2626';
                    placedPill.appendChild(numSpan);

                    // Add answer text
                    const textSpan = document.createElement('span');
                    textSpan.textContent = candText;
                    textSpan.style.flex = '1';
                    textSpan.style.minWidth = '0';
                    textSpan.style.maxWidth = '100%';
                    textSpan.style.color = isCorrect ? '#16a34a' : '#dc2626';
                    textSpan.style.fontWeight = '600';
                    textSpan.style.fontSize = '13px';
                    textSpan.title = candText || '';
                    // Prevent vertical letter stacking; wrap by words only
                    textSpan.style.whiteSpace = 'normal';
                    textSpan.style.wordBreak = 'normal';
                    textSpan.style.overflowWrap = 'anywhere'; // breaks long words if needed
                    textSpan.style.lineHeight = '1.2';
                    placedPill.appendChild(textSpan);

                    // Add V/X icon
                    const icon = document.createElement('span');
                    icon.className = 'answer-icon';
                    icon.textContent = isCorrect ? 'V' : 'X';
                    icon.style.fontWeight = '700';
                    icon.style.fontSize = '16px';
                    icon.style.color = isCorrect ? '#16a34a' : '#dc2626';
                    icon.style.flexShrink = '0';
                    placedPill.appendChild(icon);
                }
            });

            // Make options panel collapsible (button should live on layout, not inside bank)
            const layout = temp.querySelector('.mc-layout');
            const bankSide = temp.querySelector('.mc-bank-side');
            if (layout && bankSide) {
                layout.style.position = 'relative';

                const toggleBtn = document.createElement('button');
                toggleBtn.textContent = '◀';
                toggleBtn.type = 'button';
                toggleBtn.style.cssText =
                    'position:absolute; right:280px; top:50%; transform:translateY(-50%);' +
                    'background:#fff; border:1px solid #d1d5db; padding:8px 6px;' +
                    'cursor:pointer; border-radius:6px 0 0 6px; font-size:16px; z-index:9999;';

                let isCollapsed = false;

                toggleBtn.onclick = (e) => {
                    e.preventDefault();

                        toggleBtn.textContent = '◀';
                        toggleBtn.style.right = '280px';
                    }
                };

                layout.appendChild(toggleBtn);
            }

            // Create answer key panel
            const answersArea = document.createElement('div');
            answersArea.style.display = 'flex';
            answersArea.style.flexDirection = 'column';
            answersArea.style.gap = '8px';
            answersArea.style.minWidth = '240px';

            orderedZones.forEach((zone) => {
                const zoneNum = zone.n;
                const correctOptionId = zone.correctOptionId;
                const correctOption = options.find(o => o.id === correctOptionId);
                const correctLetter = correctOption ? String.fromCharCode(65 + options.indexOf(correctOption)) : '—';
                const correctText = correctOption?.text || '—';

                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.alignItems = 'center';
                item.style.gap = '8px';
                item.style.padding = '6px 10px';
                item.style.border = '1px solid #e2e8f0';
                item.style.borderRadius = '6px';
                item.style.background = '#f8fafc';
                item.style.fontSize = '13px';

                const num = document.createElement('span');
                num.textContent = String(zoneNum);
                num.style.fontWeight = '600';
                num.style.color = '#0f172a';
                num.style.minWidth = '20px';

                const ans = document.createElement('span');
                ans.innerHTML = `<span style="color:#1d4ed8; font-weight:600;">${correctLetter}</span> — ${escapeHtml(correctText)}`;
                ans.style.flex = '1';

                item.appendChild(num);
                item.appendChild(ans);
                answersArea.appendChild(item);
            });

            // Wrap visual and answer key side by side
            const visualBlock = temp.querySelector('.matching-canvas-task');
            if (visualBlock && answersArea.children.length > 0) {
                const wrapper = document.createElement('div');
                wrapper.style.display = 'flex';
                wrapper.style.gap = '16px';
                wrapper.style.alignItems = 'flex-start';

                visualBlock.parentNode.insertBefore(wrapper, visualBlock);
                wrapper.appendChild(visualBlock);
                wrapper.appendChild(answersArea);
            }

            return temp.innerHTML;
        }

        // Enhance Matching block: show candidate correctness and correct answer
        function enhanceMatchingShowCandidateAndCorrect(blockEl, block, skillAnswers) {
            const blockId = block.id;
            const options = block.data?.options || [];
            const itemsData = Array.isArray(block.data?.items) ? block.data.items : [];
            const correctMap = block.data?.answerKey || block.data?.correctAnswers || {};
            let candMap = skillAnswers?.matching?.[blockId] || {};
            if (typeof candMap === 'string') {
                try { candMap = JSON.parse(candMap); } catch { candMap = {}; }
            }

            const items = blockEl.querySelectorAll('.matching-item[data-item-num]');
            items.forEach((el) => {
                const itemNum = el.dataset.itemNum;
                if (!itemNum) return;

                const itemIndex = Math.max(0, Number(itemNum) - 1);
                const itemData = itemsData[itemIndex] || null;
                const itemId = itemData?.id || itemData?.itemId || itemData?.slotId || '';

                const candLetter = String(candMap[itemNum] || candMap[itemId] || '').trim().toUpperCase();
                const correctLetter = String(
                    correctMap[itemNum] ?? correctMap[itemId] ?? correctMap[String(itemNum)] ?? itemData?.key ?? ''
                ).trim().toUpperCase();
                const isCorrect = !!candLetter && !!correctLetter && candLetter === correctLetter;

                if (!candLetter) return;

                const candIdx = candLetter ? candLetter.charCodeAt(0) - 65 : -1;
                const candText = candIdx >= 0 && candIdx < options.length ? options[candIdx]?.text || '' : '';
                const correctIdx = correctLetter ? correctLetter.charCodeAt(0) - 65 : -1;
                const correctText = correctIdx >= 0 && correctIdx < options.length ? options[correctIdx]?.text || '' : '';

                const selectedArea = el.querySelector('.matching-selected-area');
                if (!selectedArea) return;
                selectedArea.style.display = 'flex';
                selectedArea.style.alignItems = 'center';
                selectedArea.style.gap = '8px';

                // Add V/X icon before the candidate answer
                let icon = selectedArea.querySelector('.answer-icon');
                if (!icon) {
                    icon = document.createElement('span');
                    icon.className = 'answer-icon';
                    icon.style.fontWeight = '700';
                    icon.style.marginRight = '6px';
                    selectedArea.prepend(icon);
                }
                icon.textContent = isCorrect ? 'V' : 'X';
                icon.style.color = isCorrect ? '#16a34a' : '#dc2626';

                // Apply green/red styling to the item container
                el.style.border = isCorrect ? '2px solid #16a34a' : '2px solid #dc2626';
                el.style.background = isCorrect ? '#dcfce7' : '#fee2e2';

                selectedArea.style.borderColor = isCorrect ? '#16a34a' : '#dc2626';
                selectedArea.style.background = isCorrect ? '#dcfce7' : '#fee2e2';
                selectedArea.style.color = isCorrect ? '#16a34a' : '#dc2626';

                const matchText = selectedArea.querySelector('.matching-match-text');
                if (matchText) {
                    matchText.style.flex = '1';
                    matchText.style.width = '50%';
                }

                if (!isCorrect && correctLetter) {
                    const correctLine = correctText ? `${correctLetter} — ${correctText}` : `${correctLetter}`;
                    let correctBadge = selectedArea.querySelector('.correct-badge');
                    if (!correctBadge) {
                        correctBadge = document.createElement('span');
                        correctBadge.className = 'correct-badge';
                        correctBadge.style.fontSize = '12px';
                        correctBadge.style.fontWeight = '600';
                        correctBadge.style.color = '#1d4ed8';
                        correctBadge.style.flex = '1';
                        correctBadge.style.width = '50%';
                        correctBadge.style.textAlign = 'right';
                        correctBadge.style.pointerEvents = 'none';
                        selectedArea.appendChild(correctBadge);
                    }
                    correctBadge.textContent = `Correct: ${correctLine}`;
                }
            });
        }

        // Apply red/green coloring to MCQ options based on correctness
        function colorMcqAnswers(wrapper, block, answers) {
            const data = block.data || {};
            const questions = Array.isArray(data.questions) ? data.questions : [];
            const answerKey = data.answerKey || data.correctAnswers || data.answers || {};

            console.debug('[MCQ] color: block.id', block.id, 'answerKey keys', Object.keys(answerKey || {}), 'answers.mcq keys', Object.keys(answers.mcq || {}));
            
            questions.forEach((q, qi) => {
                const qId = q.id || `q_${qi}`;
                const isMulti = !!q.allowMultiple;
                const key = `${block.id}:${qId}`;
                const savedAnswer = answers.mcq?.[key];
                const raw = answerKey[qId] ?? answerKey[String(qi + 1)] ?? q.correctIndices ?? q.correctIndex ?? null;
                
                // Normalize saved answer to array
                let candidateIndices = [];
                if (isMulti && Array.isArray(savedAnswer)) {
                    candidateIndices = savedAnswer;
                } else if (!isMulti && typeof savedAnswer === 'number') {
                    candidateIndices = [savedAnswer];
                }
                
                // Normalize correct answer to array
                const correctIndices = parseMcqCorrect(raw);
                console.debug('[MCQ] color row', { blockId: block.id, qi, qId, key, savedAnswer, raw, correctIndices, isMulti, candidateIndices });
                
                // Find all option labels in the question
                const questionBlocks = wrapper.querySelectorAll('[style*="margin-bottom: 16px"]');
                if (questionBlocks[qi]) {
                    const optionLabels = questionBlocks[qi].querySelectorAll('label');
                    optionLabels.forEach((label, oi) => {
                        const input = label.querySelector('input');
                        if (input?.checked) {
                            let icon = label.querySelector('.answer-icon');
                            if (!icon) {
                                icon = document.createElement('span');
                                icon.className = 'answer-icon';
                                icon.style.marginRight = '6px';
                                icon.style.fontWeight = '700';
                                label.prepend(icon);
                            }

                            // Color each selected option individually
                            if (correctIndices.includes(oi)) {
                                // Selected and correct
                                icon.textContent = 'V';
                                icon.style.color = '#16a34a';
                                label.style.background = '#dcfce7';
                                label.style.color = '#16a34a';
                            } else {
                                // Selected but incorrect
                                icon.textContent = 'X';
                                icon.style.color = '#dc2626';
                                label.style.background = '#fee2e2';
                                label.style.color = '#dc2626';
                            }
                        }
                    });
                }
            });
        }

        // Get attemptId from URL
        function getAttemptIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('attemptId') || params.get('id');
        }

        // Get skill from URL
        function getSkillFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('skill');
        }

        // Initialize
        async function init() {
            attemptId = getAttemptIdFromUrl();
            selectedSkill = getSkillFromUrl();
            
            if (!attemptId) {
                showError('No attempt ID provided');
                return;
            }

            try {
                currentAttempt = await getAttemptById(attemptId);
                if (!currentAttempt) {
                    showError('Attempt not found');
                    return;
                }

                renderCandidateInfo();
                await loadAndRenderTestInfo();
                await renderAttempt();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                showError(`Failed to load attempt: ${error.message}`);
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            const errorEl = document.getElementById('error');
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
        }

        // Render candidate information
        function renderCandidateInfo() {
            if (!currentAttempt) return;

            document.getElementById('candidateName').textContent = currentAttempt.candidateName || '-';
            document.getElementById('candidateId').textContent = currentAttempt.candidateId || '-';
            document.getElementById('examId').textContent = currentAttempt.examId || '-';
            document.getElementById('attemptStatus').textContent = currentAttempt.status || '-';
            
            // Format submitted timestamp
            if (currentAttempt.submittedAt) {
                const date = currentAttempt.submittedAt.toDate ? currentAttempt.submittedAt.toDate() : new Date(currentAttempt.submittedAt);
                document.getElementById('submittedAt').textContent = date.toLocaleString();
            } else {
                document.getElementById('submittedAt').textContent = '-';
            }

            document.getElementById('candidateInfo').style.display = 'block';
        }

        // Load and render test information
        async function loadAndRenderTestInfo() {
            if (!currentAttempt || !currentAttempt.skills) return;

            // Get test ID from the first available skill or selected skill
            let testId = null;
            if (selectedSkill && currentAttempt.skills[selectedSkill]) {
                testId = currentAttempt.skills[selectedSkill].testId;
            } else {
                // Get from first available skill
                const skills = Object.keys(currentAttempt.skills);
                if (skills.length > 0) {
                    testId = currentAttempt.skills[skills[0]].testId;
                }
            }

            if (!testId) return;

            try {
                currentTest = await TESTS_DB.loadTest(testId);
                if (!currentTest) return;

                document.getElementById('testName').textContent = currentTest.name || currentTest.title || '-';
                document.getElementById('testId').textContent = currentTest.id || '-';
                document.getElementById('testSkill').textContent = currentTest.skill || '-';
                document.getElementById('testDuration').textContent = currentTest.totalTimeMin ? `${currentTest.totalTimeMin} min` : '-';
                document.getElementById('testSections').textContent = currentTest.sections ? currentTest.sections.length : (currentTest.totalSections || '-');

                document.getElementById('testInfo').style.display = 'block';
            } catch (error) {
                console.error('Failed to load test info:', error);
            }
        }

        // Render examiner-specific matching_headings compact UI
        function renderExaminerMatchingHeadings(block, skill, answers) {
            const data = block.data || {};
            const slots = data.slots || [];
            const options = data.options || [];
            const answerKey = data.answerKey || {};
            
            // Get saved matches for this block
            const skillLower = (skill || '').toLowerCase();
            const savedMatches = answers.matching?.[block.id] || {};
            
            let html = `<div class="matching-examiner-view" style="margin-top: 12px;">`;
            
            if (slots.length === 0) {
                html += `<div style="color: #999; font-style: italic; padding: 16px; text-align: center;">No slots defined.</div>`;
                html += `</div>`;
                return html;
            }
            
            // Header
            html += `<div style="font-weight: 600; color: #333; margin-bottom: 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Matching Review</div>`;
            
            // Slots loop
            html += `<div style="display: flex; flex-direction: column; gap: 12px;">`;
            
            for (const slot of slots) {
                const slotId = slot.slotId || slot.id;
                const slotLabel = slot.label || slotId;
                const candidateLetter = savedMatches[slotId];
                const correctLetter = answerKey[slotId];
                const isCorrect = candidateLetter && candidateLetter === correctLetter;
                
                // Build candidate pill
                let candidatePill = '—';
                if (candidateLetter) {
                    const optIdx = candidateLetter.charCodeAt(0) - 65;
                    let text = '';
                    if (optIdx >= 0 && optIdx < options.length) {
                        const opt = options[optIdx];
                        text = `${candidateLetter}. ${opt.text || ''}`;
                    } else {
                        text = `${candidateLetter}. [Unknown]`;
                    }
                    const icon = isCorrect ? 'V' : 'X';
                    candidatePill = `${icon} ${text}`;
                }
                
                // Build correct pill
                let correctPill = '—';
                if (correctLetter) {
                    const optIdx = correctLetter.charCodeAt(0) - 65;
                    if (optIdx >= 0 && optIdx < options.length) {
                        const opt = options[optIdx];
                        correctPill = `${correctLetter}. ${opt.text || ''}`;
                    } else {
                        correctPill = `${correctLetter}. [Unknown]`;
                    }
                }
                
                // Determine match status
                const statusColor = !candidateLetter ? '#999' : isCorrect ? '#16a34a' : '#dc2626';
                const statusBg = !candidateLetter ? '#f3f4f6' : isCorrect ? '#dcfce7' : '#fee2e2';
                
                html += `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; align-items: center;">
                        <div>
                            <div style="font-size: 12px; color: #666; font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Slot: ${escapeHtml(slotLabel)}</div>
                            <div style="padding: 8px 12px; background: ${statusBg}; border: 2px dashed ${statusColor}; border-radius: 4px; font-size: 13px; color: ${statusColor}; font-weight: 500; min-height: 20px;">
                                ${escapeHtml(candidatePill)}
                            </div>
                        </div>
                        <div>
                            <div style="font-size: 12px; color: #666; font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Correct</div>
                            <div style="padding: 8px 12px; background: #dcfce7; border: 1px solid #16a34a; border-radius: 4px; font-size: 13px; color: #16a34a; font-weight: 500;">
                                ${escapeHtml(correctPill)}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            html += `</div>`;
            html += `</div>`;
            return html;
        }

        // Render attempt with all blocks using candidate block renderers
        async function renderAttempt() {
            const blocksContainer = document.getElementById('blocks');
            blocksContainer.innerHTML = '';

            // Filter to only the selected skill if provided
            let skills = Object.keys(currentAttempt.skills || {});
            if (selectedSkill) {
                skills = skills.filter(s => s.toLowerCase() === selectedSkill.toLowerCase());
            }

            for (const skill of skills) {
                const skillData = currentAttempt.skills[skill];
                const blocks = await getBlocksForSkill(skill, skillData);
                const answers = skillData.answers || {};

                // Get auto-score data for this skill if available
                const autoScoreData = currentAttempt.autoScore?.[skill];

                for (const block of blocks) {
                    try {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'block-wrapper';
                        
                        // Determine if block is auto-scorable
                        const isAutoScorable = canAutoScore(block);
                        
                        // Find block score if auto-score was run
                        const blockScore = autoScoreData?.byBlock?.find(b => 
                            b.blockId === block.data?.id || b.label === getBlockLabel(block)
                        );
                        
                        // Add grading indicator at the top
                        const indicator = createGradingIndicator(isAutoScorable, blockScore);
                        
                        // Check for examiner-specific matching_headings rendering
                        let blockHtml = '';
                        if (block.type && block.type.toLowerCase() === 'matching_headings') {
                            blockHtml = renderExaminerMatchingHeadings(block, skill, answers);
                        } else {
                            // Use candidate block renderer with read-only context
                            const ctx = createReadOnlyContext(skill, block, answers);
                            blockHtml = await renderBlock(block, ctx);
                        }
                        
                        // Enhance with correct answers for certain block types
                        const blockType = block.type ? block.type.toLowerCase() : '';
                        console.log('[renderAttempt] Processing block', { skill, blockId: block.id, blockType, blockTypeRaw: block.type });
                        
                        if (blockType === 'tfng') {
                            blockHtml = enhanceTfngWithCorrectAnswers(blockHtml, block, answers);
                        } else if (blockType === 'mcq_set') {
                            blockHtml = enhanceMcqWithCorrectAnswers(blockHtml, block, answers);
                        } else if (blockType === 'gap_fill' || blockType === 'gap_fill_visual') {
                            console.log('[renderAttempt] Calling gap_fill enhancement');
                            blockHtml = enhanceGapFillWithCorrectAnswers(blockHtml, block, answers);
                        } else if (blockType === 'matching_visual') {
                            blockHtml = enhanceMatchingVisualWithCorrectAnswers(blockHtml, block, answers);
                        }
                        
                        wrapper.innerHTML = indicator + blockHtml;
                        
                        // Apply color coding after DOM insertion
                        if (blockType === 'tfng') {
                            colorTfngAnswers(wrapper, block, answers);
                        } else if (blockType === 'mcq_set') {
                            colorMcqAnswers(wrapper, block, answers);
                        } else if (blockType === 'matching') {
                            enhanceMatchingShowCandidateAndCorrect(wrapper, block, answers);
                        }
                        
                        // Disable inputs if auto-scored
                        if (isAutoScorable) {
                            wrapper.classList.add('auto-scored');
                            // Disable all inputs within this block
                            setTimeout(() => {
                                wrapper.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(input => {
                                    input.disabled = true;
                                });
                            }, 0);
                        }
                        
                        blocksContainer.appendChild(wrapper);
                    } catch (error) {
                        console.error(`Failed to render block ${block.id}:`, error);
                    }
                }
            }
        }

        // Determine if a block can be auto-scored
        function canAutoScore(block) {
            const autoScorableTypes = [
                'gap_fill',
                'gap_fill_visual',
                'tfng',
                'mcq_set',
                'matching',
                'matching_visual',
                'matching_headings'
            ];
            return block && block.type && autoScorableTypes.includes(block.type.toLowerCase());
        }

        // Create grading indicator badge
        function createGradingIndicator(isAutoScorable, blockScore) {
            if (isAutoScorable) {
                let html = `<div class="block-grading-badge auto">`;
                html += `<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>`;
                html += `<span>Auto-scored</span>`;
                html += `</div>`;
                
                // If we have score data, show it
                if (blockScore) {
                    html += `<div class="block-auto-score">`;
                    html += `<div class="score-item">`;
                    html += `<span class="score-label">Score:</span>`;
                    html += `<span class="score-value">${blockScore.correct}/${blockScore.total}</span>`;
                    html += `</div>`;
                    const accuracy = blockScore.total > 0 ? Math.round((blockScore.correct / blockScore.total) * 100) : 0;
                    html += `<div class="score-item">`;
                    html += `<span class="score-label">Accuracy:</span>`;
                    html += `<span class="score-value">${accuracy}%</span>`;
                    html += `</div>`;
                    html += `</div>`;
                }
                
                return html;
            } else {
                let html = `<div class="block-grading-badge manual">`;
                html += `<svg fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>`;
                html += `<span>Examiner grading required</span>`;
                html += `</div>`;
                return html;
            }
        }

        // Helper function to get block label
        function getBlockLabel(block) {
            const data = block.data || {};
            return data.title || data.instructions || block.type || 'Untitled Block';
        }

        // Get blocks for a skill
        async function getBlocksForSkill(skill, skillData) {
            if (skillData.blocksSnapshot && Array.isArray(skillData.blocksSnapshot)) {
                return skillData.blocksSnapshot;
            }

            if (skillData.testId) {
                const test = await TESTS_DB.loadTest(skillData.testId);
                if (test && test.sections) {
                    return test.sections.flatMap(s => s.questions || s.blocks || []);
                }
            }

            return [];
        }

        // Auto-score logic
        window.runAutoScore = async function() {
            const skill = document.getElementById('skillSelect').value;
            if (!skill) {
                alert('Please select a skill');
                return;
            }

            if (!currentAttempt.skills[skill]) {
                alert('Skill not found in attempt');
                return;
            }

            try {
                const skillData = currentAttempt.skills[skill];
                const blocks = await getBlocksForSkill(skill, skillData);
                const answers = skillData.answers || {};

                const scorePayload = await computeAutoScore({
                    skill,
                    blocks,
                    attempt: currentAttempt,
                    answers
                });

                displayAutoScoreResult(scorePayload);
                await saveAutoScore(attemptId, scorePayload);
                
                // Update current attempt with auto-score data
                if (!currentAttempt.autoScore) currentAttempt.autoScore = {};
                currentAttempt.autoScore[skill] = scorePayload;
                
                // Re-render to show block-level scores
                await renderAttempt();
            } catch (error) {
                alert(`Auto-score failed: ${error.message}`);
                console.error(error);
            }
        };

        function displayAutoScoreResult(payload) {
            const resultEl = document.getElementById('autoScoreResult');
            resultEl.innerHTML = `
                <strong>Score:</strong> ${payload.correct || 0}/${payload.totalQuestions || 0}<br>
                <strong>Accuracy:</strong> ${payload.accuracy || 0}%
            `;
            resultEl.classList.add('show');
        }

        // Header buttons
        window.goBack = function() {
            window.location.href = 'Examiner_Inbox.html';
        };

        window.markInReview = async function() {
            try {
                await updateAttempt(attemptId, { status: 'in_review' });
                alert('Marked as In Review');
            } catch (error) {
                alert(`Failed to update status: ${error.message}`);
            }
        };

        // Start
        init();
    </script>
</body>
